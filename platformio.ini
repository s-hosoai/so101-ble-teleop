; SO101 wireless (BLE) leader -> follower
;
;   pio run -e leader   -t upload   ; リーダー側 AtomS3
;   pio run -e follower -t upload   ; フォロワー側 AtomS3

[env]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    ftservo/FTServo@^2.0.0
    m5stack/M5Unified@^0.2.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

[env:leader]
build_src_filter = +<leader/> +<common/>
build_flags =
    ${env.build_flags}
    -DROLE_LEADER

[env:follower]
build_src_filter = +<follower/> +<common/>
build_flags =
    ${env.build_flags}
    -DROLE_FOLLOWER
